<svg width="400" height="76" viewBox="0 0 400 76" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>R1 Tech Software Solutions</title>
  <desc>R1 Tech Software Solutions — navy and gold logo, horizontal variant</desc>
  <defs>
    <clipPath id="icon-clip">
      <rect x="0" y="6" width="64" height="64" rx="12"/>
    </clipPath>
  </defs>
  <!-- Icon -->
  <rect x="0" y="6" width="64" height="64" rx="12" fill="#0d1f3c"/>
  <rect x="0" y="62" width="64" height="8" fill="#c4913a" clip-path="url(#icon-clip)"/>
  <text x="14" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#ffffff">R</text>
  <text x="40" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#c4913a">1</text>
  <!-- Divider -->
  <rect x="80" y="16" width="1.5" height="44" fill="#c4913a" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="96" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#0d1f3c" letter-spacing="0.5">R1 Tech</text>
  <text x="97" y="60" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#888780" letter-spacing="3">SOFTWARE SOLUTIONS</text>
</svg>
